<body data-page-node-id="TmC4H8BpeEuRW8ERiPvvJw">
<h1 data-page-node-id="FZeOwwM6GYaQ0KxZzpoH4N">📋 访美监控 · 填表进展</h1>
<div class="sub" data-page-node-id="IuQnkZRZqwg9Ng5Hwtv8HW"><span id="dot" data-page-node-id="OzsdRVzJ0TpaBlh8mApSgH"></span><span id="st" data-page-node-id="u1YDQEq3qGgHIXV8skqod1">加载中…</span>　口令：@机器人 B站/b站/微博/抖音 + 链接（+微博原文），时间 9.24 16点 可选</div>

<h2 data-page-node-id="ZMadCQPK44kp4To07VSh0F">📊 已加入记录（Excel 实时）</h2>
<table data-page-node-id="GN1cEocmccnjs3wk2zA5tn">
  <thead data-page-node-id="ApSIb4xp1hXO3r8WkkdmOF"><tr data-page-node-id="flR95Yr0cI0jPKBNQPJGgA"><th data-page-node-id="8x42aXonnSkE9Ncj3z6KxF">行</th><th data-page-node-id="CrlCE5MQAo9sLJATGR1e7d">记录时间</th><th data-page-node-id="8wFB1UD20PHgXJOGo8d6lH">稿件标题</th><th data-page-node-id="twcd6JiwDkxArzaEOKeT4M">播放量</th><th data-page-node-id="PVEQIS9PBrZJzKB0uFoQbA">抖音链接</th><th data-page-node-id="pEEH86JqpXpR0ESwRILwup">微博链接</th><th data-page-node-id="I3i5cAxpU0QNpKYuVG00Xl">截图</th></tr></thead>

<h2 data-page-node-id="7CA0D6jB0JKIIZXKqHXu4B">🖼 历史截图（点击看原图）</h2>

<h2 data-page-node-id="mF2fhwkQYvxx2XGVI2byQK">📰 事件流</h2>
<table data-page-node-id="oGCpRUkqEMe3XUCeapEj2s">
  <thead data-page-node-id="nrhEhrUoQep3Ovt1MIP1oL"><tr data-page-node-id="zNoyJsZQYGUfVfTOXeaxSi"><th data-page-node-id="6wVa67RTVZZIWWngVWSBFN">时间</th><th data-page-node-id="jSd9fqrfKLN59ZuJrhWfbs">类型</th><th data-page-node-id="6X41DFwPeazIxNuCCBRt3z">内容</th><th data-page-node-id="9lBEuyDrTG7WILQnNDSYEk">状态</th></tr></thead>
  <tbody id="tb" data-page-node-id="gNXH2gyKOO5wLEPmAr01aS"></tbody>
</table>

<script>
const KINDS = ["消息", "结果", "启动", "恢复", "断线", "skip"];
const esc = s => (s || "").replace(/</g, "&lt;");
// API 基址：固定指向本机 watcher。本地打开、挂 GitHub Pages 都能用
//（浏览器对 http://127.0.0.1 的请求不算混合内容；8790 服务端已加 CORS 允许跨域）
const API = "http://127.0.0.1:8790";

async function load() {
  try {
    // 事件流
    const evs = await (await fetch(API + "/api/progress")).json();
    document.getElementById("dot").className = "";
    document.getElementById("st").textContent = "监控运行中，共 " + evs.length + " 条事件";
    document.getElementById("tb").innerHTML = evs.slice().reverse().map(e => {
      const kind = KINDS.find(k => e.kind && e.kind.includes(k)) || "skip";
      return `<tr class="${kind}"><td class="ts">${e.ts || ""}</td>` +
        `<td class="kind"><span class="tag">${e.kind || ""}</span></td>` +
        `<td>${esc(e.text)}</td><td class="status">${esc(e.status)}</td></tr>`;
    }).join("");
  } catch (err) {
    document.getElementById("dot").className = "off";
    document.getElementById("st").textContent = "连不上 watcher（fill_watch.py 没在跑？）";
  }
  try {
    // 记录表 + 截图
    const recs = await (await fetch(API + "/api/records")).json();
    document.getElementById("rec").innerHTML = (Array.isArray(recs) ? recs : []).map(r => {
      const shot = (has, name) => has
        ? `<a href="${API}/shots/${name}" target="_blank"><span class="ok">✔ ${name.startsWith("douyin") ? "抖音" : "微博"}</span></a>`
        : `<span class="no">✖</span>`;
      return `<tr><td>${r.row}</td><td class="ts">${esc(r.time)}</td>` +
        `<td>${esc(r.title).slice(0, 40)}</td><td>${r.view}</td>` +
        `<td><a href="${esc(r.douyin)}" target="_blank">${r.douyin ? "链接" : "—"}</a></td>` +
        `<td><a href="${esc(r.weibo)}" target="_blank">${r.weibo ? "链接" : "—"}</a></td>` +
        `<td>${shot(r.douyin_shot, "douyin_r" + r.row + ".png")} ${shot(r.weibo_shot, "weibo_r" + r.row + ".png")}</td></tr>`;
    }).join("");
    const cards = [];
    recs.forEach(r => {
      if (r.douyin_shot) cards.push(["douyin_r" + r.row + ".png", `第${r.row}行 · 抖音`]);
      if (r.weibo_shot) cards.push(["weibo_r" + r.row + ".png", `第${r.row}行 · 微博`]);
    });
    document.getElementById("shots").innerHTML = cards.map(([f, cap]) =>
      `<div class="shot-card"><a href="${API}/shots/${f}" target="_blank"><img src="${API}/shots/${f}" loading="lazy"></a>` +
      `<div class="cap">${cap}</div></div>`).join("") || "<span class='sub'>还没有截图</span>";
  } catch (err) { /* records 接口异常不阻塞事件流 */ }
}
load();
setInterval(load, 3000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>B站监控管理面板</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 20px; background: white; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #4CAF50; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
    .warn { background-color: #ffe0e0; font-weight: bold; }
    .done { background-color: #e0ffe0; }
    button { margin: 2px; padding: 6px 14px; cursor: pointer; border: none; border-radius: 4px; background: #4CAF50; color: white; font-size: 13px; }
    button:hover { background: #45a049; }
    button.danger { background: #f44336; }
    button.danger:hover { background: #d32f2f; }
    button.secondary { background: #2196F3; }
    button.secondary:hover { background: #1976D2; }
    .form-row { margin-bottom: 10px; }
    label { display: inline-block; width: 130px; }
    input, select { width: 220px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; }
    .modal-content { background: white; margin: 5% auto; padding: 20px; width: 600px; border-radius: 8px; max-height: 80vh; overflow-y: auto; }
    .section { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; background: white; border-radius: 8px; }
    .section h2 { margin-top: 0; }
    #progress-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 1000; text-align: center; padding-top: 100px; }
    .progress-container { width: 50%; margin: auto; }
    .progress-bar { width: 100%; background: #f0f0f0; border-radius: 8px; overflow: hidden; }
    .progress-fill { width: 0%; height: 30px; background: #4CAF50; text-align: center; line-height: 30px; color: white; transition: width 0.3s; }
    .step-text { margin: 15px 0; font-size: 18px; }
    .sub-step { font-size: 14px; color: #666; margin: 5px 0; }
    .auto-refresh-hint { color: gray; font-size: 0.9em; margin-left: 10px; }
    .fans-display { background: #e8f5e9; padding: 10px; border-radius: 4px; margin-top: 10px; }
    .fans-display table { margin-bottom: 0; }
  </style>
</head>
<body>
  <h1>B站视频监控管理</h1>

  <div class="section">
    <h2>📺 普通视频监控 <span class="auto-refresh-hint">(每10分钟自动刷新)</span></h2>
    <button onclick="openAddModal()">批量添加 BV</button>
    <button onclick="pushSelected()" class="secondary">手动推送选中视频</button>
    <button onclick="pushAll()" class="secondary">一键推送全部视频</button>
    <button onclick="deleteSelected()" class="danger">删除选中</button>
    <button onclick="openEditModal()">编辑选中</button>
    <button onclick="viewHistory()">查看历史</button>
    <button onclick="loadVideos()">手动刷新列表</button>
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="selectAll" onchange="toggleAll(this)"></th>
          <th>BV号</th><th>标题</th><th>UP主</th><th>分组</th><th>已推送小时</th><th>预警</th>
        </tr>
      </thead>
      <tbody id="video-tbody"></tbody>
    </table>
  </div>

  <div class="section">
    <h2>🚩 共青团搬运监控（达标 80000 自动推送） <span class="auto-refresh-hint">(每10分钟自动刷新)</span></h2>
    <button onclick="openGqtAddModal()">添加共青团视频</button>
    <button onclick="pushGqtSelected()" class="secondary">手动推送选中视频</button>
    <button onclick="refreshGqtStatus()" class="secondary">手动刷新状态</button>
    <button onclick="deleteGqtSelected()" class="danger">删除选中</button>
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="selectAllGqt" onchange="toggleAllGqt(this)"></th>
          <th>BV号</th><th>标题</th><th>当前播放量</th><th>状态</th>
        </tr>
      </thead>
      <tbody id="gqt-video-tbody"></tbody>
    </table>
  </div>

  <div class="section">
    <h2>📊 粉丝监控设置</h2>
    <div class="form-row"><label>新闻UID:</label><input id="newsUid" value="456664753"></div>
    <div class="form-row"><label>军事UID:</label><input id="militaryUid" value="46470268"></div>
    <div class="form-row"><label>周一基准新闻:</label><input id="mondayNews" type="number" placeholder="自动记录，可手动覆盖"></div>
    <div class="form-row"><label>周一基准军事:</label><input id="mondayMilitary" type="number" placeholder="自动记录，可手动覆盖"></div>
    <div class="form-row"><label>Webhook URL:</label><input id="webhookUrl" placeholder="留空使用默认"></div>
    <div class="form-row"><label>启用监控:</label><input type="checkbox" id="fansEnabled"></div>
    <button onclick="saveFansSettings()">保存设置</button>
    <button onclick="triggerFansPush()" class="secondary">立即推送粉丝数据</button>
    <div id="fans-display" class="fans-display" style="display:none;">
      <h3>最近一次粉丝数据</h3>
      <table>
        <tr><th>项目</th><th>央视新闻</th><th>央视军事</th><th>差值</th></tr>
        <tr><td>实时粉丝</td><td id="fd-news">-</td><td id="fd-military">-</td><td id="fd-diff">-</td></tr>
        <tr><td>日维度涨粉</td><td id="fd-dnews">-</td><td id="fd-dmil">-</td><td id="fd-ddiff">-</td></tr>
        <tr><td>周维度涨粉</td><td id="fd-wnews">-</td><td id="fd-wmil">-</td><td id="fd-wdiff">-</td></tr>
      </table>
    </div>
  </div>

  <!-- 进度条覆盖层 -->
  <div id="progress-overlay">
    <div class="progress-container">
      <h2 id="progress-title">推送进度</h2>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill" style="width: 0%;">0%</div>
      </div>
      <p id="step-text" class="step-text">准备中...</p>
      <p id="sub-step-text" class="sub-step"></p>
    </div>
  </div>

  <!-- 添加普通视频弹窗 -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <h3>添加 BV</h3>
      <p>多个 BV 用英文逗号分隔，CID 和标题会自动获取</p>
      <div class="form-row"><label>BV号:</label><input id="bvInput" placeholder="BVxxx, BVyyy"></div>
      <div class="form-row"><label>开始时间:</label><input id="startTime" placeholder="如 2026-07-29 09:56"></div>
      <div class="form-row"><label>已监控小时:</label><input id="monitoredHours" type="number" value="0"></div>
      <div class="form-row"><label>组名:</label><input id="groupName" placeholder="留空自动生成"></div>
      <div class="form-row"><label>仅预警:</label><input type="checkbox" id="alertOnlyAdd"></div>
      <button onclick="addVideos()">提交</button>
      <button onclick="closeModal('addModal')" class="danger">取消</button>
    </div>
  </div>

  <!-- 编辑视频弹窗 -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h3>编辑视频</h3>
      <div class="form-row"><label>CID:</label><input id="editCid"></div>
      <div class="form-row"><label>开始时间:</label><input id="editStartTime"></div>
      <div class="form-row"><label>已推送小时:</label><input id="editCurrentHour" type="number"></div>
      <div class="form-row"><label>总监控时长:</label><input id="editMonitorHours" type="number"></div>
      <div class="form-row"><label>推送频率(小时):</label><input id="editNotifyInterval" type="number" step="0.5"></div>
      <div class="form-row"><label>组名:</label><input id="editGroupName"></div>
      <div class="form-row"><label>窗口开始:</label><input id="editWinStart" type="number"></div>
      <div class="form-row"><label>窗口结束:</label><input id="editWinEnd" type="number"></div>
      <div class="form-row"><label>启用预警:</label><input type="checkbox" id="editAlertEnabled"></div>
      <div class="form-row"><label>在线阈值:</label><input id="editOnlineTh" type="number"></div>
      <div class="form-row"><label>里程碑(万):</label><input id="editMilestone" type="number" step="0.1"></div>
      <div class="form-row"><label>检查间隔(分):</label><input id="editInterval" type="number"></div>
      <div class="form-row"><label>仅预警:</label><input type="checkbox" id="editAlertOnly"></div>
      <button onclick="saveEdit()">保存</button>
      <button onclick="closeModal('editModal')" class="danger">取消</button>
    </div>
  </div>

  <!-- 添加共青团视频弹窗 -->
  <div id="gqtAddModal" class="modal">
    <div class="modal-content">
      <h3>添加共青团搬运视频</h3>
      <p>自动设置预警阈值为 80000，每 30 分钟检查一次</p>
      <div class="form-row"><label>BV号:</label><input id="gqtBvInput" placeholder="BVxxx"></div>
      <button onclick="addGqtVideo()">提交</button>
      <button onclick="closeModal('gqtAddModal')" class="danger">取消</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://erzjcvsbrkmukswkqfss.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_pj3uHezveNeVekWTioVT1Q_BH1waa1g';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    // ========== 工具函数 ==========
    // 生成 "YYYY-MM-DD HH:MM" 格式的时间字符串（不含T和时区）
    function formatLocalDateTime(date) {
      const d = date || new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // 格式化播放量
    function formatView(n) {
      if (!n) return '0';
      if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + 'w';
      return n.toString();
    }

    // ========== 进度条逻辑 ==========
    let pollingTimer = null;
    function showProgress(title) {
      document.getElementById('progress-overlay').style.display = 'block';
      document.getElementById('progress-title').innerText = title || '推送进度';
      updateProgress(0, '正在提交请求...', '');
    }
    function updateProgress(percent, mainText, subText) {
      const fill = document.getElementById('progress-fill');
      fill.style.width = percent + '%';
      fill.innerText = percent + '%';
      document.getElementById('step-text').innerText = mainText;
      document.getElementById('sub-step-text').innerText = subText || '';
    }
    function hideProgress() {
      document.getElementById('progress-overlay').style.display = 'none';
      if (pollingTimer) clearInterval(pollingTimer);
      pollingTimer = null;
    }
    const STATUS_STEPS = {
      'pending': { percent: 5, main: '请求已提交，等待后台处理...', sub: '' },
      'processing': { percent: 15, main: '后台已收到请求，开始处理...', sub: '正在读取视频信息' },
      'fetching_cid': { percent: 35, main: '正在获取视频 CID...', sub: '通过B站API获取视频标识符' },
      'pushing': { percent: 65, main: '正在获取最新播放量并推送...', sub: '查询B站接口，发送企业微信消息' },
      'done': { percent: 100, main: '✅ 操作完成！', sub: '' },
      'error': { percent: 0, main: '❌ 操作失败', sub: '请查看日志或检查视频信息' }
    };
    async function pollPushStatus(requestId) {
      let attempts = 0;
      const maxAttempts = 45;
      updateProgress(5, '已提交请求，等待后台开始处理...', '');
      pollingTimer = setInterval(async () => {
        attempts++;
        if (attempts >= maxAttempts) {
          updateProgress(0, '⏰ 操作超时，请稍后重试', '后台可能未响应');
          clearInterval(pollingTimer);
          setTimeout(hideProgress, 3000);
          return;
        }
        try {
          const { data, error } = await supabase.from('push_requests').select('status').eq('id', requestId).single();
          if (error) {
            updateProgress(0, '查询状态失败', error.message);
            clearInterval(pollingTimer);
            setTimeout(hideProgress, 2000);
            return;
          }
          if (!data) { updateProgress(5, '等待后台开始处理...', ''); return; }
          const step = STATUS_STEPS[data.status] || STATUS_STEPS['pending'];
          updateProgress(step.percent, step.main, step.sub);
          if (data.status === 'done' || data.status === 'error') {
            clearInterval(pollingTimer);
            setTimeout(() => { hideProgress(); loadVideos(); loadGqtVideos(); }, 2500);
          }
        } catch (e) {
          updateProgress(0, '轮询异常', e.toString());
          clearInterval(pollingTimer);
          setTimeout(hideProgress, 2000);
        }
      }, 2000);
    }

    // ========== 普通视频列表 ==========
    async function loadVideos() {
      try {
        const { data, error } = await supabase.from('videos').select('*').order('created_at', { ascending: false });
        if (error) { console.error(error); return; }
        const filtered = (data || []).filter(v => v.category !== 'gqt');
        const tbody = document.getElementById('video-tbody');
        tbody.innerHTML = filtered.map(v => `
          <tr>
            <td><input type="checkbox" value="${v.id}" class="video-check"></td>
            <td>${v.bvid}</td>
            <td>${v.title || '<span style="color:#999">获取中...</span>'}</td>
            <td>${v.up_name || ''}</td>
            <td>${v.group_name || ''}</td>
            <td>${v.current_hour ?? 0}h</td>
            <td>${v.alert_enabled ? '是' : '否'}</td>
          </tr>
        `).join('');
      } catch(e) { console.error(e); }
    }
    function getSelectedIds() {
      return [...document.querySelectorAll('.video-check:checked')].map(cb => parseInt(cb.value));
    }

    async function addVideos() {
      const bvText = document.getElementById('bvInput').value.trim();
      let startTime = document.getElementById('startTime').value.trim();
      const monitoredHours = parseInt(document.getElementById('monitoredHours').value) || 0;
      const groupName = document.getElementById('groupName').value.trim() || `web_${formatLocalDateTime().slice(0,10)}`;
      const alertOnly = document.getElementById('alertOnlyAdd').checked;
      if (!bvText) return alert('请输入BV号');

      // 修复：确保时间格式为 "YYYY-MM-DD HH:MM"（空格分隔，不是T）
      if (!startTime) {
        startTime = formatLocalDateTime();
      }

      const bvs = bvText.split(',').map(b => b.trim()).filter(b => b.startsWith('BV'));
      const entries = bvs.map(bv => ({
        bvid: bv,
        start_time: startTime,
        monitored_hours: monitoredHours,
        current_hour: monitoredHours,
        group_name: groupName,
        alert_only: alertOnly,
        category: ''
      }));

      const { data: newVideos, error } = await supabase.from('videos').insert(entries).select();
      if (error) { alert('添加失败：' + error.message); return; }
      if (newVideos) {
        // 插入 new_video 请求，后台补全 CID 和元数据（不推送，首次推送在 start_time+1h）
        await supabase.from('push_requests').insert(newVideos.map(v => ({ action: 'new_video', video_id: v.id, status: 'pending' })));
      }
      alert('添加成功！后台正在获取视频信息，首次推送将在开始时间+1小时后自动执行');
      closeModal('addModal');
      loadVideos();
    }

    async function pushSelected() {
      if (window.isPushing) return;
      const ids = getSelectedIds();
      if (!ids.length) return alert('请勾选视频');
      window.isPushing = true;
      try {
        const events = ids.map(video_id => ({ action: 'push', video_id, status: 'pending' }));
        const { data, error } = await supabase.from('push_requests').insert(events).select();
        if (error) { alert('推送请求提交失败：' + error.message); return; }
        if (data && data.length > 0) {
          showProgress('手动推送进度');
          pollPushStatus(data[0].id);
        } else alert('请求已提交，但未获取到ID');
      } finally {
        window.isPushing = false;
      }
    }

    async function pushAll() {
      if (window.isPushing) return;
      const { data: videos } = await supabase.from('videos').select('id').neq('alert_only', true).neq('category', 'gqt');
      if (!videos || videos.length === 0) return alert('没有可推送的视频');
      window.isPushing = true;
      try {
        const events = videos.map(v => ({ action: 'push', video_id: v.id, status: 'pending' }));
        const { error } = await supabase.from('push_requests').insert(events);
        if (error) alert('推送请求提交失败');
        else alert(`已提交 ${videos.length} 个视频，后台将逐个推送`);
      } finally {
        window.isPushing = false;
      }
    }

    async function deleteSelected() {
      const ids = getSelectedIds();
      if (!ids.length) return alert('请选中视频');
      if (!confirm(`确定删除 ${ids.length} 个视频？`)) return;
      const { error } = await supabase.from('videos').delete().in('id', ids);
      if (error) alert('删除失败');
      else loadVideos();
    }

    let editingId = null;
    async function openEditModal() {
      const ids = getSelectedIds();
      if (ids.length !== 1) return alert('请选中一个视频');
      editingId = ids[0];
      const { data, error } = await supabase.from('videos').select('*').eq('id', editingId).single();
      if (error || !data) { alert('获取视频信息失败'); return; }

      document.getElementById('editCid').value = data.cid || '';
      document.getElementById('editStartTime').value = data.start_time || '';
      document.getElementById('editCurrentHour').value = data.current_hour ?? 0;
      document.getElementById('editMonitorHours').value = data.monitor_hours || 49;
      document.getElementById('editNotifyInterval').value = data.notify_interval || 1;
      document.getElementById('editGroupName').value = data.group_name || '';
      document.getElementById('editWinStart').value = data.window_start || 0;
      document.getElementById('editWinEnd').value = data.window_end || 24;
      document.getElementById('editAlertEnabled').checked = data.alert_enabled || false;
      document.getElementById('editOnlineTh').value = data.alert_online_threshold || 0;
      document.getElementById('editMilestone').value = (data.alert_milestone || 0) / 10000;
      document.getElementById('editInterval').value = data.alert_interval_minutes || 15;
      document.getElementById('editAlertOnly').checked = data.alert_only || false;
      document.getElementById('editModal').style.display = 'block';
    }

    async function saveEdit() {
      if (!editingId) return;
      const updated = {
        cid: document.getElementById('editCid').value,
        start_time: document.getElementById('editStartTime').value,
        current_hour: parseInt(document.getElementById('editCurrentHour').value) || 0,
        monitor_hours: parseInt(document.getElementById('editMonitorHours').value) || 49,
        notify_interval: parseFloat(document.getElementById('editNotifyInterval').value) || 1,
        group_name: document.getElementById('editGroupName').value,
        window_start: parseInt(document.getElementById('editWinStart').value) || 0,
        window_end: parseInt(document.getElementById('editWinEnd').value) || 24,
        alert_enabled: document.getElementById('editAlertEnabled').checked,
        alert_online_threshold: parseInt(document.getElementById('editOnlineTh').value) || 0,
        alert_milestone: Math.floor(parseFloat(document.getElementById('editMilestone').value) * 10000) || null,
        alert_interval_minutes: parseInt(document.getElementById('editInterval').value) || 15,
        alert_only: document.getElementById('editAlertOnly').checked,
      };
      const { error } = await supabase.from('videos').update(updated).eq('id', editingId);
      if (error) { alert('更新失败：' + error.message); return; }
      alert('已更新');
      closeModal('editModal');
      loadVideos();
    }

    async function viewHistory() {
      const ids = getSelectedIds();
      if (ids.length !== 1) return alert('请选择一个视频');
      const videoId = ids[0];
      const { data, error } = await supabase.from('history').select('*').eq('video_id', videoId).order('hour', { ascending: true });
      if (error) { alert('加载失败'); return; }
      if (!data || data.length === 0) { alert('暂无历史'); return; }
      let msg = data.map(r => `${r.hour}h  播放:${r.view}  在看:${r.online_total}`).join('\n');
      alert(msg);
    }

    // ========== 共青团板块 ==========
    async function loadGqtVideos() {
      try {
        const { data, error } = await supabase.from('videos').select('*').eq('category', 'gqt').order('created_at', { ascending: false });
        if (error) { console.error(error); return; }
        const tbody = document.getElementById('gqt-video-tbody');
        tbody.innerHTML = (data || []).map(v => {
          const isReached = v.view >= 80000;
          const isAlertDisabled = !v.alert_enabled;
          let statusText = '监控中';
          let rowClass = '';
          if (isReached && isAlertDisabled) {
            statusText = '✅ 已达标';
            rowClass = 'done';
          } else if (isReached) {
            statusText = '🔔 达标推送中';
            rowClass = 'warn';
          }
          return `
            <tr class="${rowClass}">
              <td><input type="checkbox" value="${v.id}" class="gqt-check"></td>
              <td>${v.bvid}</td>
              <td>${v.title || '<span style="color:#999">获取中...</span>'}</td>
              <td>${formatView(v.view)}</td>
              <td>${statusText}</td>
            </tr>
          `;
        }).join('');
      } catch(e) { console.error(e); }
    }

    async function addGqtVideo() {
      const bv = document.getElementById('gqtBvInput').value.trim();
      if (!bv || !bv.startsWith('BV')) return alert('请输入正确的BV号');
      // 修复：使用正确的时间格式
      const nowStr = formatLocalDateTime();
      const entry = {
        bvid: bv, category: 'gqt',
        alert_enabled: true, alert_milestone: 80000,
        alert_interval_minutes: 30, alert_only: true,
        start_time: nowStr,
        monitored_hours: 0, current_hour: 0,
        group_name: '共青团搬运', notify_interval: 1.0,
        window_start: 0, window_end: 24, view: 0
      };
      const { data, error } = await supabase.from('videos').insert([entry]).select();
      if (error) { alert('添加失败：' + error.message); return; }
      if (data) {
        await supabase.from('push_requests').insert([{ action: 'new_video', video_id: data[0].id, status: 'pending' }]);
      }
      alert('共青团视频已添加，后台将自动补全CID并开始监控');
      closeModal('gqtAddModal');
      loadGqtVideos();
    }

    async function pushGqtSelected() {
      const ids = [...document.querySelectorAll('.gqt-check:checked')].map(cb => parseInt(cb.value));
      if (!ids.length) return alert('请勾选视频');
      const events = ids.map(video_id => ({ action: 'push', video_id, status: 'pending' }));
      const { data, error } = await supabase.from('push_requests').insert(events).select();
      if (error) { alert('推送请求提交失败：' + error.message); return; }
      if (data && data.length > 0) {
        showProgress('共青团手动推送进度');
        pollPushStatus(data[0].id);
      }
    }

    async function refreshGqtStatus() {
      const { error } = await supabase.from('push_requests').insert([{ action: 'gqt_refresh', video_id: 0, status: 'pending' }]);
      if (error) alert('刷新请求失败：' + error.message);
      else {
        alert('手动刷新已发送，稍后将更新播放量');
        setTimeout(loadGqtVideos, 5000);
      }
    }

    async function deleteGqtSelected() {
      const ids = [...document.querySelectorAll('.gqt-check:checked')].map(cb => parseInt(cb.value));
      if (!ids.length) return alert('请勾选视频');
      if (!confirm(`确定删除选中的 ${ids.length} 个共青团视频？`)) return;
      const { error } = await supabase.from('videos').delete().in('id', ids);
      if (error) alert('删除失败');
      else loadGqtVideos();
    }

    // ========== 粉丝监控 ==========
    async function loadFansSettings() {
      try {
        const { data, error } = await supabase.from('fans_monitor').select('*').limit(1);
        if (error) { console.error('加载粉丝设置失败:', error); return; }
        if (data && data.length > 0) {
          const fm = data[0];
          if (fm.cctv_news_uid) document.getElementById('newsUid').value = fm.cctv_news_uid;
          if (fm.cctv_military_uid) document.getElementById('militaryUid').value = fm.cctv_military_uid;
          if (fm.monday_base_news) document.getElementById('mondayNews').value = fm.monday_base_news;
          if (fm.monday_base_military) document.getElementById('mondayMilitary').value = fm.monday_base_military;
          if (fm.webhook_url) document.getElementById('webhookUrl').value = fm.webhook_url;
          document.getElementById('fansEnabled').checked = fm.enabled || false;

          // 显示最近粉丝数据（如果有基准数据）
          if (fm.daily_base_news || fm.monday_base_news) {
            document.getElementById('fans-display').style.display = 'block';
            document.getElementById('fd-news').innerText = '-';
            document.getElementById('fd-military').innerText = '-';
            // 基准数据展示
            if (fm.daily_base_news) {
              document.getElementById('fd-dnews').innerText = `基准: ${fm.daily_base_news}`;
              document.getElementById('fd-dmil').innerText = `基准: ${fm.daily_base_military || 0}`;
            }
            if (fm.monday_base_news) {
              document.getElementById('fd-wnews').innerText = `基准: ${fm.monday_base_news}`;
              document.getElementById('fd-wmil').innerText = `基准: ${fm.monday_base_military || 0}`;
            }
          }
        }
      } catch(e) { console.error('加载粉丝设置异常:', e); }
    }

    async function saveFansSettings() {
      const fm = {
        cctv_news_uid: document.getElementById('newsUid').value,
        cctv_military_uid: document.getElementById('militaryUid').value,
        monday_base_news: parseInt(document.getElementById('mondayNews').value) || 0,
        monday_base_military: parseInt(document.getElementById('mondayMilitary').value) || 0,
        webhook_url: document.getElementById('webhookUrl').value,
        enabled: document.getElementById('fansEnabled').checked,
      };
      const { data: existing } = await supabase.from('fans_monitor').select('id').limit(1);
      if (existing && existing.length > 0) {
        await supabase.from('fans_monitor').update(fm).eq('id', existing[0].id);
      } else {
        await supabase.from('fans_monitor').insert(fm);
      }
      alert('粉丝监控设置已保存');
    }

    async function triggerFansPush() {
      await saveFansSettings();
      const { error } = await supabase.from('push_requests').insert([{ action: 'fans_push', video_id: 0, status: 'pending' }]);
      if (error) alert('请求失败');
      else alert('推送请求已发送，后台将立即执行粉丝数据推送');
    }

    // ========== 弹窗/工具 ==========
    function openAddModal() { document.getElementById('addModal').style.display = 'block'; }
    function openGqtAddModal() { document.getElementById('gqtAddModal').style.display = 'block'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function toggleAll(cb) { document.querySelectorAll('.video-check').forEach(c => c.checked = cb.checked); }
    function toggleAllGqt(cb) { document.querySelectorAll('.gqt-check').forEach(c => c.checked = cb.checked); }

    // ========== 暴露全局函数 ==========
    window.loadVideos = loadVideos;
    window.addVideos = addVideos;
    window.pushSelected = pushSelected;
    window.pushAll = pushAll;
    window.deleteSelected = deleteSelected;
    window.openEditModal = openEditModal;
    window.saveEdit = saveEdit;
    window.viewHistory = viewHistory;
    window.loadGqtVideos = loadGqtVideos;
    window.addGqtVideo = addGqtVideo;
    window.pushGqtSelected = pushGqtSelected;
    window.refreshGqtStatus = refreshGqtStatus;
    window.deleteGqtSelected = deleteGqtSelected;
    window.openGqtAddModal = openGqtAddModal;
    window.closeModal = closeModal;
    window.saveFansSettings = saveFansSettings;
    window.triggerFansPush = triggerFansPush;

    // ========== 自动刷新：10分钟 ==========
    setInterval(loadVideos, 600000);
    setInterval(loadGqtVideos, 600000);

    // ========== 页面初始化 ==========
    loadVideos();
    loadGqtVideos();
    loadFansSettings();
  </script>
</body>
</html>

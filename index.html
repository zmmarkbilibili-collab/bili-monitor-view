<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>B站监控管理面板</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 20px; background: white; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; font-size: 13px; }
    th { background: #4CAF50; color: white; position: sticky; top: 0; z-index: 1; }
    tr:nth-child(even) { background: #f9f9f9; }
    .warn { background-color: #ffe0e0; font-weight: bold; }
    .done { background-color: #e0ffe0; }
    button { margin: 2px; padding: 6px 14px; cursor: pointer; border: none; border-radius: 4px; background: #4CAF50; color: white; font-size: 13px; }
    button:hover { background: #45a049; }
    button.danger { background: #f44336; }
    button.danger:hover { background: #d32f2f; }
    button.secondary { background: #2196F3; }
    button.secondary:hover { background: #1976D2; }
    .form-row { margin-bottom: 10px; }
    label { display: inline-block; width: 100px; }
    input, select { padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; }
    .modal-content { background: white; margin: 3% auto; padding: 20px; width: 650px; border-radius: 8px; max-height: 85vh; overflow-y: auto; }
    .section { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; background: white; border-radius: 8px; }
    .section h2 { margin-top: 0; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; white-space: nowrap; }
    .badge-error { background: #f44336; color: white; }
    .badge-info { background: #00BCD4; color: white; }
    .badge-pending { background: #FF9800; color: white; }
    .badge-done { background: #4CAF50; color: white; }
    .view-num { color: #e83e8c; font-weight: bold; }
    .online-num { color: #007bff; }
    .time-text { color: #888; font-size: 12px; }
    .group-header td { background: #e3f2fd !important; font-weight: bold; color: #1565c0; }
    tr.highlighted > td { background: #fff3cd !important; }
    .toolbar { position: sticky; top: 0; z-index: 10; background: white; padding: 8px 0; margin-bottom: 5px; border-bottom: 1px solid #eee; }
    .auto-refresh-hint { color: gray; font-size: 0.9em; margin-left: 10px; }
    .log-section { max-height: 400px; overflow-y: auto; }
    .log-section table { font-size: 12px; }
    .log-level-INFO { color: #2196F3; }
    .log-level-ERROR { color: #f44336; font-weight: bold; }
    .hl-btn { padding:2px 8px; font-size:12px; border:1px solid #ff9800; background:#fff; color:#ff9800; border-radius:4px; cursor:pointer; }
    .hl-btn.on { background:#ff9800; color:#fff; }
    .history-section { max-height: 500px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>B站视频监控管理</h1>

  <div class="section">
    <h2>📺 普通视频监控 <span class="auto-refresh-hint">(每5分钟自动刷新)</span></h2>
    <div class="toolbar">
    <button id="btn-add">批量添加 BV</button>
    <button id="btn-push-sel" class="secondary">手动推送选中</button>
    <button id="btn-push-all" class="secondary">一键推送全部</button>
    <button id="btn-del-sel" class="danger">删除选中</button>
    <button id="btn-edit">编辑选中</button>
    <button id="btn-history">查看历史</button>
    <button id="btn-refresh">刷新列表</button>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:30px"><input type="checkbox" id="selectAll"></th>
          <th style="width:115px">BV号</th><th>标题</th><th style="width:90px">UP主</th><th style="width:95px">分组</th>
          <th style="width:70px">播放量</th><th style="width:50px">在线</th><th style="width:135px">开始时间</th>
          <th style="width:40px">已推</th><th style="width:65px">进度</th><th style="width:80px">上次推送</th><th style="width:40px">推送</th><th style="width:45px">突出</th>
        </tr>
      </thead>
      <tbody id="video-tbody"></tbody>
    </table>
  </div>

  <div class="section">
    <h2>🚩 共青团搬运监控（达标 80000 自动推送） <span class="auto-refresh-hint">(每5分钟自动刷新)</span></h2>
    <div class="toolbar">
    <button id="btn-gqt-add">添加共青团视频</button>
    <button id="btn-gqt-push" class="secondary">手动推送选中</button>
    <button id="btn-gqt-refresh" class="secondary">手动刷新播放量</button>
    <button id="btn-gqt-del" class="danger">删除选中</button>
    </div>
    <table>
      <thead>
        <tr><th style="width:30px"><input type="checkbox" id="selectAllGqt"></th><th>BV号</th><th>标题</th><th>UP主</th><th>当前播放量</th><th>状态</th><th>加入时间</th></tr>
      </thead>
      <tbody id="gqt-video-tbody"></tbody>
    </table>
  </div>

  <div class="section log-section">
    <h2>📋 操作日志 <span class="auto-refresh-hint">(每30秒自动刷新)</span></h2>
    <div class="toolbar" style="position:sticky;top:0;z-index:10;">
    <button id="btn-refresh-log">刷新日志</button>
    <button id="btn-clear-log" class="danger">清空日志</button>
    </div>
    <table>
      <thead><tr><th style="width:150px">时间</th><th style="width:100px">类型</th><th style="width:70px">级别</th><th>详情</th><th style="width:70px">操作</th></tr></thead>
      <tbody id="log-tbody"><tr><td colspan="5" style="text-align:center;color:#999;">加载中...</td></tr></tbody>
    </table>
  </div>

  <div class="section history-section">
    <h2>🗂️ 历史稿件查询</h2>
    <div class="toolbar" style="position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
      <input id="mhSearch" placeholder="搜索 BV号/标题/UP/组名" style="width:200px;">
      <select id="mhStatus" style="width:130px;"><option value="">全部状态</option><option value="active">在监控中</option><option value="removed">已删除</option></select>
      <select id="mhMonth" style="width:150px;"><option value="">全部时间</option></select>
      <button id="btn-mh-search">查询</button>
      <button id="btn-mh-refresh" class="secondary">刷新</button>
      <button id="btn-mh-export" class="secondary">📥 导出Excel</button>
      <span id="mhCount" style="color:#888;font-size:13px;margin-left:8px;"></span>
    </div>
    <table>
      <thead><tr><th>BV号</th><th>标题</th><th>UP主</th><th>组名</th><th>状态</th><th>日期</th><th>时间</th></tr></thead>
      <tbody id="mh-tbody"><tr><td colspan="7" style="text-align:center;color:#999;">加载中...</td></tr></tbody>
    </table>
  </div>

  <div id="addModal" class="modal">
    <div class="modal-content">
      <h3>添加 BV</h3>
      <div class="form-row"><label>BV号:</label><input id="bvInput" placeholder="BVxxx, BVyyy" style="width:300px;"></div>
      <div class="form-row"><label>开始时间:</label><input id="startTime" style="width:180px;"> <button id="btn-now-time">此刻</button></div>
      <div class="form-row"><label>组名:</label><input id="groupName" list="groupList" style="width:200px;"><datalist id="groupList"></datalist></div>
      <div class="form-row"><label>仅预警:</label><input type="checkbox" id="alertOnlyAdd"></div>
      <button id="btn-submit-add">提交</button>
      <button id="btn-cancel-add" class="danger">取消</button>
    </div>
  </div>

  <div id="editModal" class="modal">
    <div class="modal-content">
      <h3>编辑视频</h3>
      <div class="form-row"><label>CID:</label><input id="editCid"></div>
      <div class="form-row"><label>开始时间:</label><input id="editStartTime"></div>
      <div class="form-row"><label>已推送小时:</label><input id="editCurrentHour" type="number"></div>
      <div class="form-row"><label>总监控时长:</label><input id="editMonitorHours" type="number"></div>
      <div class="form-row"><label>推送频率(h):</label><input id="editNotifyInterval" type="number" step="0.5"></div>
      <div class="form-row"><label>组名:</label><input id="editGroupName"></div>
      <div class="form-row"><label>窗口开始:</label><input id="editWinStart" type="number"> <span style="color:#888;font-size:12px">(推送允许时间段)</span></div>
      <div class="form-row"><label>窗口结束:</label><input id="editWinEnd" type="number"></div>
      <div class="form-row"><label>突出显示:</label><input type="checkbox" id="editHighlight"></div>
      <hr>
      <div class="form-row"><label>推送开关:</label><input type="checkbox" id="editPushEnabled"> <span style="color:#888;font-size:12px">开启后才推送企微</span></div>
      <hr>
      <h4>📊 播放量差距预警</h4>
      <div class="form-row"><label>启用差距预警:</label><input type="checkbox" id="editGapAlertEnabled"></div>
      <div class="form-row"><label>对比稿件:</label><select id="editGapTargetBvids" style="width:280px;"><option value="">-- 无 --</option></select></div>
      <div class="form-row"><label>差距阈值:</label><input id="editGapThreshold" type="number" placeholder="播放量差距在此值内时提醒"></div>
      <hr>
      <h4>📈 在线人数预警</h4>
      <div class="form-row"><label>启用在线预警:</label><input type="checkbox" id="editOnlineAlertEnabled"></div>
      <div class="form-row"><label>对比稿件:</label><select id="editOnlineAlertBvids" style="width:280px;"><option value="">-- 无 --</option></select></div>
      <div class="form-row"><label>条件:</label>
        <select id="editOnlineAlertCondition" style="width:200px;">
          <option value="double">在线人数超半小时前1倍</option>
          <option value="threshold">在线人数超过指定值</option>
        </select>
      </div>
      <div class="form-row"><label>超过阈值:</label><input id="editOnlineAlertThreshold" type="number" placeholder="如 1000"></div>
      <button id="btn-submit-edit">保存</button>
      <button id="btn-cancel-edit" class="danger">取消</button>
    </div>
  </div>

  <div id="groupEditModal" class="modal">
    <div class="modal-content">
      <h3>编辑整组</h3>
      <div class="form-row"><label>组名:</label><input id="grpGroupName" readonly style="background:#f0f0f0;"></div>
      <div class="form-row"><label>开始时间:</label><input id="grpStartTime"> <button id="btn-grp-now">此刻</button></div>
      <div class="form-row"><label>总监控时长:</label><input id="grpMonitorHours" type="number"></div>
      <div class="form-row"><label>推送频率(h):</label><input id="grpNotifyInterval" type="number" step="0.5"></div>
      <div class="form-row"><label>窗口开始:</label><input id="grpWinStart" type="number"> <span style="color:#888;font-size:12px">(推送允许时间段)</span></div>
      <div class="form-row"><label>窗口结束:</label><input id="grpWinEnd" type="number"></div>
      <hr>
      <div class="form-row"><label>推送开关:</label><input type="checkbox" id="grpPushEnabled"></div>
      <button id="btn-submit-grp-edit">保存</button>
      <button id="btn-cancel-grp-edit" class="danger">取消</button>
    </div>
  </div>

  <div id="gqtAddModal" class="modal">
    <div class="modal-content">
      <h3>添加共青团搬运视频</h3>
      <div class="form-row"><label>BV号:</label><input id="gqtBvInput" placeholder="BVxxx"></div>
      <button id="btn-submit-gqt">提交</button>
      <button id="btn-cancel-gqt" class="danger">取消</button>
    </div>
  </div>

  <div id="historyModal" class="modal">
    <div class="modal-content">
      <h3>历史监控数据</h3>
      <div style="margin-bottom:10px;"><button id="btn-copy-history">一键复制</button><button id="btn-cancel-history" class="danger">关闭</button></div>
      <textarea id="historyText" readonly style="width:100%;height:400px;font-family:monospace;font-size:13px;resize:vertical;white-space:pre;"></textarea>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const supabase = createClient('https://erzjcvsbrkmukswkqfss.supabase.co', 'sb_publishable_pj3uHezveNeVekWTioVT1Q_BH1waa1g');

    function formatLocalDateTime(d) {
      d = d || new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function formatView(n) { if (!n) return '0'; if (n >= 10000) return (n/10000).toFixed(1).replace(/\.0$/,'')+'w'; return String(n); }
    function formatTime(iso) {
      if (!iso) return '-';
      try { const d = new Date(iso); return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
      catch { return iso; }
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function getSelected() { return [...document.querySelectorAll('.video-check:checked')].map(c => parseInt(c.value)); }

    async function loadVideos() {
      try {
        const { data } = await supabase.from('videos').select('*').order('created_at', { ascending: false });
        const filtered = (data||[]).filter(v => v.category !== 'gqt');
        const groups = {}; const order = [];
        filtered.forEach(v => { const g = v.group_name || '未分组'; if (!groups[g]) { groups[g] = []; order.push(g); } groups[g].push(v); });
        let html = '';
        order.forEach(g => {
          const vids = groups[g];
          vids.sort((a,b) => { const ah = a.highlight?1:0, bh = b.highlight?1:0; if(ah!==bh) return bh-ah; return (Number(b.view)||0)-(Number(a.view)||0); });
          html += `<tr class="group-header"><td colspan="13">📁 ${g} (${vids.length}个) <button class="group-edit-btn" data-group="${g}" style="float:right;padding:3px 12px;font-size:12px;">编辑整组</button></td></tr>`;
          vids.forEach(v => {
            const h = v.current_hour ?? 0;
            const p = Math.min(h/48*100, 100);
            const hl = v.highlight ? ' highlighted' : '';
            html += `<tr class="${hl}"${h>48?' style="opacity:0.5"':''}>
              <td><input type="checkbox" value="${v.id}" class="video-check"></td>
              <td><a href="https://www.bilibili.com/video/${v.bvid}" target="_blank" style="color:#2196F3">${v.bvid}</a></td>
              <td>${v.title||'<span style="color:#999">获取中...</span>'}</td>
              <td>${v.up_name||'-'}</td><td>${v.group_name||'-'}</td>
              <td class="view-num">${formatView(v.view)}</td>
              <td class="online-num">${v.online_total||'-'}</td>
              <td class="time-text">${v.start_time||'-'}</td><td>${h}h</td>
              <td><div style="background:#e0e0e0;border-radius:3px;height:10px;width:50px;display:inline-block"><div style="height:100%;width:${p}%;background:#4CAF50;border-radius:3px"></div></div> ${h}/48</td>
              <td class="time-text">${formatTime(v.last_push_time)}</td>
              <td>${v.push_enabled?'<span style="color:#4CAF50">开</span>':'<span style="color:#f44336">关</span>'}</td>
              <td><button class="hl-btn ${v.highlight?'on':''}" data-id="${v.id}" data-hl="${v.highlight?1:0}">${v.highlight?'★':'☆'}</button></td>
            </tr>`;
          });
        });
        document.getElementById('video-tbody').innerHTML = html || '<tr><td colspan="13" style="text-align:center">暂无视频</td></tr>';
      } catch(e) { console.error(e); }
    }

    async function loadGqtVideos() {
      try {
        const { data } = await supabase.from('videos').select('*').eq('category','gqt').order('created_at',{ascending:false});
        document.getElementById('gqt-video-tbody').innerHTML = (data||[]).map(v => {
          const reached = v.view >= 80000;
          let st = '监控中', bc = 'badge-pending';
          if (reached && !v.alert_enabled) { st = '✅已达标'; bc = 'badge-done'; }
          else if (reached) { st = '🔔达标'; bc = 'badge-error'; }
          return `<tr class="${reached?'done':''}"><td><input type="checkbox" value="${v.id}" class="gqt-check"></td>
            <td><a href="https://www.bilibili.com/video/${v.bvid}" target="_blank" style="color:#2196F3">${v.bvid}</a></td>
            <td>${v.title||'获取中...'}</td><td>${v.up_name||'-'}</td>
            <td class="view-num">${formatView(v.view)}</td><td><span class="badge ${bc}">${st}</span></td>
            <td class="time-text">${formatTime(v.created_at)}</td></tr>`;
        }).join('') || '<tr><td colspan="7">暂无</td></tr>';
      } catch(e) { console.error(e); }
    }

    async function addVideos() {
      const bvs = document.getElementById('bvInput').value.split(/[,，\s\n]+/).map(b=>b.trim()).filter(b=>b.startsWith('BV'));
      if (!bvs.length) return alert('请输入BV号');
      let st = document.getElementById('startTime').value.trim() || formatLocalDateTime();
      const gn = document.getElementById('groupName').value.trim();
      const ao = document.getElementById('alertOnlyAdd').checked;
      const entries = bvs.map(bv => ({
        bvid: bv, start_time: st, current_hour: 0, monitor_hours: 48,
        group_name: gn || `web_${new Date().toISOString().slice(0,10)}`,
        alert_only: ao, category: null, notify_interval: 1, window_start: 0, window_end: 24,
        alert_enabled: false, alert_milestone: null, alert_interval_minutes: 15,
        view: 0, title: '', up_name: '', push_enabled: false,
        gap_alert_enabled: false, gap_alert_target_bvid: '[]', gap_alert_threshold: 0,
        online_alert_enabled: false, online_alert_bvids: '[]', online_alert_condition: 'double', online_alert_threshold: 0
      }));
      const { data: newVids, error } = await supabase.from('videos').insert(entries).select();
      if (error) { alert('添加失败: '+error.message); return; }
      if (newVids?.length) {
        await supabase.from('push_requests').insert(newVids.map(v=>({action:'new_video',video_id:v.id,status:'pending'})));
        await supabase.from('manuscript_history').upsert(bvs.map(bv=>({
          bvid: bv, title:'', up_name:'', group_name: gn||'', status:'active',
          added_at: new Date().toISOString()
        })), {onConflict:'bvid'});
      }
      alert(`已添加 ${bvs.length} 个视频`); closeModal('addModal'); loadVideos();
    }

    async function pushSelected() {
      const ids = getSelected(); if (!ids.length) return alert('请勾选');
      await supabase.from('push_requests').insert(ids.map(vid=>({action:'push',video_id:vid,status:'pending'})));
      alert('已提交推送请求');
    }
    async function pushAll() {
      const { data } = await supabase.from('videos').select('id').neq('category','gqt').eq('alert_only',false);
      if (!data?.length) return alert('无视频');
      if (!confirm(`推送全部${data.length}个？`)) return;
      await supabase.from('push_requests').insert(data.map(v=>({action:'push',video_id:v.id,status:'pending'})));
      alert('已提交');
    }

    async function deleteSelected() {
      const ids = getSelected(); if (!ids.length) return alert('请勾选');
      if (!confirm(`删除${ids.length}个视频？`)) return;
      const { data: toDel } = await supabase.from('videos').select('bvid').in('id', ids);
      const bvids = (toDel||[]).map(v=>v.bvid).filter(Boolean);
      if (bvids.length) await supabase.from('manuscript_history').update({status:'removed',removed_at:new Date().toISOString()}).in('bvid',bvids);
      await supabase.from('videos').delete().in('id', ids);
      loadVideos();
    }

    let editingId = null;
    async function openEdit() {
      const ids = getSelected(); if (ids.length !== 1) return alert('请选一个');
      editingId = ids[0];
      const { data: v } = await supabase.from('videos').select('*').eq('id',editingId).single();
      if (!v) return alert('未找到');
      document.getElementById('editCid').value = v.cid||'';
      document.getElementById('editStartTime').value = v.start_time||'';
      document.getElementById('editCurrentHour').value = v.current_hour??0;
      document.getElementById('editMonitorHours').value = v.monitor_hours||48;
      document.getElementById('editNotifyInterval').value = v.notify_interval||1;
      document.getElementById('editGroupName').value = v.group_name||'';
      document.getElementById('editWinStart').value = v.window_start||0;
      document.getElementById('editWinEnd').value = v.window_end||24;
      document.getElementById('editHighlight').checked = v.highlight||false;
      document.getElementById('editPushEnabled').checked = v.push_enabled||false;
      document.getElementById('editGapAlertEnabled').checked = v.gap_alert_enabled||false;
      document.getElementById('editGapThreshold').value = v.gap_alert_threshold||'';
      document.getElementById('editOnlineAlertEnabled').checked = v.online_alert_enabled||false;
      document.getElementById('editOnlineAlertCondition').value = v.online_alert_condition||'double';
      document.getElementById('editOnlineAlertThreshold').value = v.online_alert_threshold||'';

      const gn = (v.group_name || '未分组').trim();
      const { data: allVids } = await supabase.from('videos').select('bvid,title,group_name').neq('category','gqt');
      const sameGroup = (allVids||[]).filter(x => (x.group_name||'未分组').trim() === gn && x.bvid !== v.bvid);

      let gapOpts = '<option value="">-- 无 --</option>';
      sameGroup.forEach(x => gapOpts += `<option value="${x.bvid}">${x.bvid} - ${x.title||'获取中...'}</option>`);
      document.getElementById('editGapTargetBvids').innerHTML = gapOpts;
      document.getElementById('editOnlineAlertBvids').innerHTML = gapOpts;

      const gapSel = document.getElementById('editGapTargetBvids');
      const onlineSel = document.getElementById('editOnlineAlertBvids');
      try {
        const gapBvids = JSON.parse(v.gap_alert_target_bvid||'[]');
        const onlineBvids = JSON.parse(v.online_alert_bvids||'[]');
        if (gapBvids.length > 0) gapSel.value = gapBvids[0];
        if (onlineBvids.length > 0) onlineSel.value = onlineBvids[0];
      } catch(e) {}
      document.getElementById('editModal').style.display = 'block';
    }

    async function saveEdit() {
      if (!editingId) return;
      const gapVal = document.getElementById('editGapTargetBvids').value;
      const onlineVal = document.getElementById('editOnlineAlertBvids').value;
      await supabase.from('videos').update({
        cid: document.getElementById('editCid').value,
        start_time: document.getElementById('editStartTime').value,
        current_hour: parseInt(document.getElementById('editCurrentHour').value)||0,
        monitor_hours: parseInt(document.getElementById('editMonitorHours').value)||48,
        notify_interval: parseFloat(document.getElementById('editNotifyInterval').value)||1,
        group_name: document.getElementById('editGroupName').value,
        window_start: parseInt(document.getElementById('editWinStart').value)||0,
        window_end: parseInt(document.getElementById('editWinEnd').value)||24,
        highlight: document.getElementById('editHighlight').checked,
        push_enabled: document.getElementById('editPushEnabled').checked,
        gap_alert_enabled: document.getElementById('editGapAlertEnabled').checked,
        gap_alert_target_bvid: gapVal ? JSON.stringify([gapVal]) : '[]',
        gap_alert_threshold: parseInt(document.getElementById('editGapThreshold').value)||0,
        online_alert_enabled: document.getElementById('editOnlineAlertEnabled').checked,
        online_alert_bvids: onlineVal ? JSON.stringify([onlineVal]) : '[]',
        online_alert_condition: document.getElementById('editOnlineAlertCondition').value,
        online_alert_threshold: parseInt(document.getElementById('editOnlineAlertThreshold').value)||0,
      }).eq('id', editingId);
      alert('已更新'); closeModal('editModal'); loadVideos();
    }

    async function viewHistory() {
      const ids = getSelected(); if (ids.length !== 1) return alert('请选一个');
      const { data } = await supabase.from('history').select('*').eq('video_id',ids[0]).order('hour',{ascending:true});
      if (!data?.length) return alert('暂无');
      document.getElementById('historyText').value = data.map(r=>`${r.hour}h  播放:${formatView(r.view)}  在线:${r.online_total}`).join('\n');
      document.getElementById('historyModal').style.display = 'block';
    }

    async function refreshList() {
      await supabase.from('push_requests').insert([{action:'refresh_stats',video_id:0,status:'pending'}]);
      alert('刷新请求已发送'); setTimeout(loadVideos, 10000);
    }

    async function toggleHighlight(id, cur) { await supabase.from('videos').update({highlight:!cur}).eq('id',id); loadVideos(); }

    async function addGqt() {
      const bv = document.getElementById('gqtBvInput').value.trim();
      if (!bv.startsWith('BV')) return alert('请输入BV号');
      await supabase.from('videos').insert([{bvid:bv,category:'gqt',alert_enabled:true,alert_milestone:80000,alert_only:true,start_time:formatLocalDateTime(),current_hour:0,monitor_hours:48,group_name:'共青团',push_enabled:false,view:0}]);
      closeModal('gqtAddModal'); loadGqtVideos();
    }
    async function pushGqt() {
      const ids = [...document.querySelectorAll('.gqt-check:checked')].map(c=>parseInt(c.value));
      if (!ids.length) return alert('请勾选');
      await supabase.from('push_requests').insert(ids.map(vid=>({action:'push',video_id:vid,status:'pending'})));
      alert('已提交');
    }
    async function refreshGqt() {
      await supabase.from('push_requests').insert([{action:'gqt_refresh',video_id:0,status:'pending'}]);
      alert('已发送'); setTimeout(loadGqtVideos, 5000);
    }
    async function deleteGqt() {
      const ids = [...document.querySelectorAll('.gqt-check:checked')].map(c=>parseInt(c.value));
      if (!ids.length) return alert('请勾选');
      await supabase.from('videos').delete().in('id',ids); loadGqtVideos();
    }

    async function loadLogs() {
      try {
        const { data } = await supabase.from('monitor_logs').select('*').order('created_at',{ascending:false}).limit(50);
        if (data?.length) {
          document.getElementById('log-tbody').innerHTML = data.map(r => {
            const lc = r.level==='ERROR'?'log-level-ERROR':r.level==='WARNING'?'':'log-level-INFO';
            return `<tr><td class="time-text">${formatTime(r.created_at)}</td><td>${r.action||'-'}</td><td class="${lc}">${r.level}</td><td>${r.message||''}</td><td><button class="danger" style="font-size:11px;padding:2px 6px;">删</button></td></tr>`;
          }).join('');
          return;
        }
      } catch(e) {}
      document.getElementById('log-tbody').innerHTML = '<tr><td colspan="5">暂无</td></tr>';
    }
    async function clearLogs() {
      if (!confirm('清空全部日志？')) return;
      await supabase.from('monitor_logs').delete().not('id','is',null);
      loadLogs();
    }

    let editingGroup = null;
    async function openGroupEdit(gn) {
      editingGroup = gn;
      const { data } = await supabase.from('videos').select('*').order('created_at', { ascending: false });
      const gv = (data||[]).filter(v => (v.group_name || '未分组').trim() === gn.trim());
      if (!gv.length) {
        const allGroups = [...new Set((data||[]).map(v=>v.group_name||'未分组'))];
        alert(`未找到组"${gn}"的视频。\n数据库中的组名: ${allGroups.join(', ')}`);
        return;
      }
      const f = gv[0];
      document.getElementById('grpGroupName').value = gn;
      document.getElementById('grpStartTime').value = f.start_time||'';
      document.getElementById('grpMonitorHours').value = f.monitor_hours||48;
      document.getElementById('grpNotifyInterval').value = f.notify_interval||1;
      document.getElementById('grpWinStart').value = f.window_start||0;
      document.getElementById('grpWinEnd').value = f.window_end||24;
      document.getElementById('grpPushEnabled').checked = f.push_enabled||false;
      document.getElementById('groupEditModal').style.display = 'block';
    }
    async function saveGroupEdit() {
      if (!editingGroup) return;
      const { data: allVids } = await supabase.from('videos').select('id,group_name').neq('category','gqt');
      const ids = (allVids||[]).filter(v => (v.group_name||'未分组').trim() === editingGroup.trim()).map(v=>v.id);
      if (!ids.length) { alert('未找到该组视频'); return; }
      const { error } = await supabase.from('videos').update({
        start_time: document.getElementById('grpStartTime').value,
        monitor_hours: parseInt(document.getElementById('grpMonitorHours').value)||48,
        notify_interval: parseFloat(document.getElementById('grpNotifyInterval').value)||1,
        window_start: parseInt(document.getElementById('grpWinStart').value)||0,
        window_end: parseInt(document.getElementById('grpWinEnd').value)||24,
        push_enabled: document.getElementById('grpPushEnabled').checked,
      }).in('id', ids);
      if (error) { alert('保存失败: '+error.message); return; }
      alert(`已更新 ${ids.length} 个视频`);
      closeModal('groupEditModal'); loadVideos();
    }

    async function loadManuscriptHistory() {
      const kw = (document.getElementById('mhSearch').value||'').trim().toLowerCase();
      const sf = document.getElementById('mhStatus').value;
      const mf = document.getElementById('mhMonth').value;
      let { data } = await supabase.from('manuscript_history').select('*').order('added_at',{ascending:false});
      let list = data||[];
      if (sf) list = list.filter(r=>(r.status||'active')===sf);
      if (mf) list = list.filter(r=>r.added_at&&r.added_at.startsWith(mf));
      if (kw) list = list.filter(r=>(r.bvid||''+r.title||''+r.up_name||''+r.group_name||'').toLowerCase().includes(kw));
      document.getElementById('mhCount').textContent = `共 ${list.length} 条`;
      document.getElementById('mh-tbody').innerHTML = list.length ? list.map(r => {
        let date = '', time = '';
        if (r.added_at) {
          try { const d = new Date(r.added_at); date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; } catch(e) {}
        }
        return `<tr><td><a href="https://www.bilibili.com/video/${r.bvid}" target="_blank" style="color:#2196F3">${r.bvid}</a></td>
        <td>${r.title||'-'}</td><td>${r.up_name||'-'}</td><td>${r.group_name||'-'}</td>
        <td>${r.status==='removed'?'<span class="badge badge-error">已删除</span>':'<span class="badge badge-done">在监控</span>'}</td>
        <td>${date||'-'}</td><td>${time||'-'}</td></tr>`;
      }).join('') : '<tr><td colspan="7">暂无</td></tr>';
    }

    function fillMonthOptions() {
      const sel = document.getElementById('mhMonth');
      let html = '<option value="">全部时间</option>';
      const now = new Date();
      for (let i = 0; i < 12; i++) {
        const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
        html += `<option value="${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}">${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}</option>`;
      }
      sel.innerHTML = html;
    }

    async function exportExcel() {
      const kw = (document.getElementById('mhSearch').value||'').trim().toLowerCase();
      const sf = document.getElementById('mhStatus').value;
      const mf = document.getElementById('mhMonth').value;
      let { data } = await supabase.from('manuscript_history').select('*').order('added_at',{ascending:false});
      let list = data||[];
      if (sf) list = list.filter(r=>(r.status||'active')===sf);
      if (mf) list = list.filter(r=>r.added_at&&r.added_at.startsWith(mf));
      if (kw) list = list.filter(r=>(r.bvid||''+r.title||''+r.up_name||''+r.group_name||'').toLowerCase().includes(kw));
      let csv = '\uFEFFBV号,标题,UP主,组名,状态,日期,时间\n';
      list.forEach(r => {
        let date = '', time = '';
        if (r.added_at) {
          try { const d = new Date(r.added_at); date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; } catch(e) {}
        }
        csv += `${r.bvid},${(r.title||'').replace(/,/g,'，')},${(r.up_name||'').replace(/,/g,'，')},${(r.group_name||'').replace(/,/g,'，')},${r.status||'active'},${date},${time}\n`;
      });
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `稿件历史_${new Date().toISOString().slice(0,10)}.csv`; a.click();
    }

    // ========== 事件绑定 ==========
    document.getElementById('btn-add').onclick = () => {
      document.getElementById('addModal').style.display = 'block';
      supabase.from('videos').select('group_name').neq('category','gqt').then(({data}) => {
        const names = [...new Set((data||[]).map(v=>v.group_name).filter(Boolean))];
        document.getElementById('groupList').innerHTML = names.map(n=>`<option value="${n}">`).join('');
      });
    };
    document.getElementById('btn-submit-add').onclick = addVideos;
    document.getElementById('btn-cancel-add').onclick = () => closeModal('addModal');
    document.getElementById('btn-now-time').onclick = () => document.getElementById('startTime').value = formatLocalDateTime();
    document.getElementById('btn-push-sel').onclick = pushSelected;
    document.getElementById('btn-push-all').onclick = pushAll;
    document.getElementById('btn-del-sel').onclick = deleteSelected;
    document.getElementById('btn-edit').onclick = openEdit;
    document.getElementById('btn-submit-edit').onclick = saveEdit;
    document.getElementById('btn-cancel-edit').onclick = () => closeModal('editModal');
    document.getElementById('btn-history').onclick = viewHistory;
    document.getElementById('btn-cancel-history').onclick = () => closeModal('historyModal');
    document.getElementById('btn-copy-history').onclick = () => { const t=document.getElementById('historyText'); t.select(); document.execCommand('copy'); alert('已复制'); };
    document.getElementById('btn-refresh').onclick = refreshList;
    document.getElementById('selectAll').onchange = function() { document.querySelectorAll('.video-check').forEach(c=>c.checked=this.checked); };
    document.getElementById('video-tbody').onclick = function(e) {
      if (e.target.classList.contains('group-edit-btn')) { openGroupEdit(e.target.dataset.group); return; }
      if (e.target.classList.contains('hl-btn')) { toggleHighlight(parseInt(e.target.dataset.id), e.target.dataset.hl==='1'); }
    };
    document.getElementById('btn-submit-grp-edit').onclick = saveGroupEdit;
    document.getElementById('btn-cancel-grp-edit').onclick = () => closeModal('groupEditModal');
    document.getElementById('btn-grp-now').onclick = () => document.getElementById('grpStartTime').value = formatLocalDateTime();

    document.getElementById('btn-gqt-add').onclick = () => document.getElementById('gqtAddModal').style.display='block';
    document.getElementById('btn-submit-gqt').onclick = addGqt;
    document.getElementById('btn-cancel-gqt').onclick = () => closeModal('gqtAddModal');
    document.getElementById('btn-gqt-push').onclick = pushGqt;
    document.getElementById('btn-gqt-refresh').onclick = refreshGqt;
    document.getElementById('btn-gqt-del').onclick = deleteGqt;
    document.getElementById('selectAllGqt').onchange = function() { document.querySelectorAll('.gqt-check').forEach(c=>c.checked=this.checked); };

    document.getElementById('btn-refresh-log').onclick = loadLogs;
    document.getElementById('btn-clear-log').onclick = clearLogs;
    document.getElementById('btn-mh-search').onclick = loadManuscriptHistory;
    document.getElementById('btn-mh-refresh').onclick = loadManuscriptHistory;
    document.getElementById('btn-mh-export').onclick = exportExcel;
    document.getElementById('mhSearch').onkeydown = e => { if(e.key==='Enter') loadManuscriptHistory(); };
    document.getElementById('mhStatus').onchange = loadManuscriptHistory;
    document.getElementById('mhMonth').onchange = loadManuscriptHistory;

    setInterval(loadVideos, 300000);
    setInterval(loadGqtVideos, 300000);
    setInterval(loadLogs, 30000);

    loadVideos();
    loadGqtVideos();
    loadLogs();
    fillMonthOptions();
    loadManuscriptHistory();

    console.log('[B站监控] 页面初始化完成');
  </script>
</body>
</html>

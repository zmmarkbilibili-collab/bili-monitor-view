<script>
(function(){
  var D = window.__BOARD_DATA__ || {videos:[],groups:[],totals:{}};
  var all = D.videos || [];
  var curGroup = '', curQ = '', curSort = 'view';

  function fmt(n){
    n = Number(n) || 0;
    if (n >= 100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'') + '亿';
    if (n >= 10000) return (n/10000).toFixed(1).replace(/\.0$/,'') + '万';
    return n.toLocaleString('zh-CN');
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  document.getElementById('stamp').textContent = D.generated_at || '--';
  document.getElementById('machine').textContent = D.machine || '--';

  var t = D.totals || {};
  document.getElementById('s-count').textContent = fmt(t.count);
  document.getElementById('s-view').textContent = fmt(t.view);
  document.getElementById('s-online').textContent = fmt(t.online);

  var tabs = document.getElementById('tabs');
  var groups = D.groups || [];
  function addTab(name, count){
    var b = document.createElement('button');
    b.className = 'tab' + (curGroup === name ? ' on' : '');
    b.innerHTML = esc(name) + '<i>' + count + '</i>';
    b.onclick = function(){ curGroup = name; render(); };
    tabs.appendChild(b);
  }
  addTab('', all.length);
  groups.forEach(function(g){ addTab(g.name, g.count); });

  function render(){
    Array.prototype.forEach.call(tabs.children, function(b, i){
      var name = i === 0 ? '' : groups[i-1].name;
      b.className = 'tab' + (name === curGroup ? ' on' : '');
    });

    var q = curQ.trim().toLowerCase();
    var list = all.filter(function(v){
      if (curGroup && v.group !== curGroup) return false;
      if (!q) return true;
      return (v.title + ' ' + v.up + ' ' + v.bvid).toLowerCase().indexOf(q) >= 0;
    });

    list.sort(function(a, b){
      if (curSort === 'title') return String(a.title).localeCompare(String(b.title), 'zh');
      if (curSort === 'added') return String(b.added_at).localeCompare(String(a.added_at));
      if (curSort === 'online') return (b.online||0) - (a.online||0);
      return (b.view||0) - (a.view||0);
    });

    var box = document.getElementById('list');
    if (!list.length){
      box.innerHTML = '<div class="empty">没有匹配的视频</div>';
      return;
    }
    box.innerHTML = list.map(function(v){
      var tag = v.category === 'gqt'
        ? '<span class="tag gqt">共青团</span>'
        : '<span class="tag">' + esc(v.group) + '</span>';
      return '<div class="row">' +
        '<div>' +
          '<div class="t"><a href="' + esc(v.url) + '" target="_blank" rel="noopener">' + esc(v.title) + '</a></div>' +
          '<div class="sub">' + tag +
            (v.up ? '<span>' + esc(v.up) + '</span>' : '') +
            '<span>' + esc(v.bvid) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="num"><b>' + fmt(v.view) + '</b><span>播放量</span></div>' +
        '<div class="num"><b>' + fmt(v.online) + '</b><span>在线人数</span></div>' +
      '</div>';
    }).join('');
  }

  document.getElementById('q').oninput = function(e){ curQ = e.target.value; render(); };
  document.getElementById('sort').onchange = function(e){ curSort = e.target.value; render(); };

  render();
})();
</script>
